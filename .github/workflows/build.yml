name: Build GameSpace APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout GameSpace Repository
      uses: actions/checkout@v4
      with:
        repository: IRedDragonICY/GameSpace
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        ndk-version: 26.1.10909125
        build-tools-version: '36.0.0'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK with Debug
      run: ./gradlew assembleRelease -x processReleaseResources --stacktrace || true
    
    - name: Upload Build Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: app/build/reports/
        retention-days: 30